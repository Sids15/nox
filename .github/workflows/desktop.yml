name: Desktop installers

# Builds the Tauri desktop apps: Windows (NSIS .exe + MSI) and macOS (a universal .dmg for Apple
# Silicon and Intel). Runs the shared gates first, then the packaged builds. Trigger it by hand
# (Actions → Run workflow), on a version tag, or on pushes that touch the desktop shell / shared
# packages. A `v*` tag also cuts a draft GitHub Release with every installer attached.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate — the same checks run before every local commit. Fail here before spending a Windows
  # runner on the packaged build.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Secret scan
        run: bash scripts/secret-scan

  build-windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      # Cache the Rust build so only our crate recompiles between runs. Keyed to the Cargo workspace
      # under src-tauri.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # `tauri build` runs the beforeBuildCommand (expo export -p web) itself, so these EXPO_PUBLIC_*
      # values get inlined into the shipped bundle here. Set them as repo secrets or the installer's
      # app can't reach Supabase. The anon key is safe to ship (RLS-protected); never put service_role.
      - name: Build installers (NSIS + MSI)
        run: bun run --cwd apps/desktop tauri build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_URL: ${{ secrets.EXPO_PUBLIC_WEB_URL }}
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.EXPO_PUBLIC_VAPID_PUBLIC_KEY }}
          EXPO_PUBLIC_INBOUND_EMAIL_DOMAIN: ${{ secrets.EXPO_PUBLIC_INBOUND_EMAIL_DOMAIN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nox-windows-installers
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # Both architectures, so one universal app runs natively on Apple Silicon and Intel Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Optional signing. With these repo secrets Tauri imports your Developer ID certificate
      # (APPLE_CERTIFICATE, a base64 .p12, + its password), signs with APPLE_SIGNING_IDENTITY and
      # notarizes with APPLE_ID + APPLE_PASSWORD (an app-specific password) + APPLE_TEAM_ID, so the
      # app opens on any Mac without a warning. Without them it is ad-hoc signed ("-").
      #
      # A secret that isn't set still arrives as an EMPTY variable, and Tauri treats a present
      # APPLE_CERTIFICATE as "import this" — an empty one failed the build ("failed to import
      # keychain certificate"). So empty Apple variables are removed before building.
      - name: Build app (universal .dmg)
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No Developer ID certificate set: building ad-hoc signed (users will see an unverified-developer prompt)."
          fi
          bun run --cwd apps/desktop tauri build --target universal-apple-darwin
        shell: bash
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_URL: ${{ secrets.EXPO_PUBLIC_WEB_URL }}
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.EXPO_PUBLIC_VAPID_PUBLIC_KEY }}
          EXPO_PUBLIC_INBOUND_EMAIL_DOMAIN: ${{ secrets.EXPO_PUBLIC_INBOUND_EMAIL_DOMAIN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: nox-macos
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # On a `v*` tag push only: attach the Windows and macOS installers to that tag's GitHub Release —
  # creating it as a DRAFT (you review the notes and click Publish) or, if you already made the
  # release on github.com (which is also what creates the tag), adding the files to it. Uses the
  # built-in gh CLI + GITHUB_TOKEN — no third-party action, no extra secret.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(dist/nox-windows-installers/*.exe dist/nox-windows-installers/*.msi dist/nox-macos/*.dmg)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Nox $GITHUB_REF_NAME" \
              --generate-notes \
              --draft
          fi
