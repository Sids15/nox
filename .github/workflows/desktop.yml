name: Desktop installers

# Builds the Tauri desktop apps: Windows (NSIS .exe + MSI) and macOS (a universal .dmg for Apple
# Silicon and Intel). Runs the shared gates first, then the packaged builds. Trigger it by hand
# (Actions → Run workflow), on a version tag, or on pushes that touch the desktop shell / shared
# packages. A `v*` tag also cuts a draft GitHub Release with every installer attached.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate — the same checks run before every local commit. Fail here before spending a Windows
  # runner on the packaged build.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Secret scan
        run: bash scripts/secret-scan

  build-windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      # Cache the Rust build so only our crate recompiles between runs. Keyed to the Cargo workspace
      # under src-tauri.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # `tauri build` runs the beforeBuildCommand (expo export -p web) itself, so these EXPO_PUBLIC_*
      # values get inlined into the shipped bundle here. Set them as repo secrets or the installer's
      # app can't reach Supabase. The anon key is safe to ship (RLS-protected); never put service_role.
      - name: Build installers (NSIS + MSI)
        run: bun run --cwd apps/desktop tauri build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nox-windows-installers
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    needs: checks
    runs-on: macos-latest
    env:
      # Optional signing. With these repo secrets the app is signed with your Developer ID and
      # notarized by Apple, so it opens on any Mac without a warning. Without them it is ad-hoc
      # signed: it runs on the Mac that built or trusted it, but Gatekeeper will warn others.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # Both architectures, so one universal app runs natively on Apple Silicon and Intel Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Only when the certificate secret exists: put the Developer ID certificate (a base64 .p12)
      # into a temporary keychain that codesign can use, and delete the file straight away.
      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      # Tauri signs with APPLE_SIGNING_IDENTITY ("-" = ad-hoc when no certificate is configured) and
      # notarizes automatically when APPLE_ID, APPLE_PASSWORD (an app-specific password) and
      # APPLE_TEAM_ID are set.
      - name: Build app (universal .dmg)
        run: bun run --cwd apps/desktop tauri build --target universal-apple-darwin
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: nox-macos
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # On a `v*` tag push only: cut ONE draft GitHub Release with the Windows and macOS installers.
  # Draft so you review the auto-generated notes and click Publish yourself. Uses the built-in gh
  # CLI + GITHUB_TOKEN — no third-party action, no extra secret.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/nox-windows-installers/*.exe \
            dist/nox-windows-installers/*.msi \
            dist/nox-macos/*.dmg \
            --title "Nox $GITHUB_REF_NAME" \
            --generate-notes \
            --draft
