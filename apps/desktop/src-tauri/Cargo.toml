[package]
name = "nox"
version = "0.1.0"
description = "Nox — personal productivity suite"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
# `generate_context!` embeds the tauri.conf.json `plugins` block as a serde_json::Value, so these
# become required the moment any plugin is configured — not before.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# On Windows/Linux a deep link launches a SECOND process with the URL in argv. single-instance
# forwards it to the already-running window instead of opening a duplicate app; its `deep-link`
# feature wires that hand-off into the deep-link plugin. Must be registered before deep-link.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
